<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ステージ候補プレビュー</title>
<style>
  body { margin: 0; padding: 8px; background: #eef4f8; font: 12px/1.3 sans-serif; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .item { background: #fff; border: 1px solid #ccd; border-radius: 6px; padding: 4px; }
  .item canvas { display: block; width: 180px; height: 320px; }
  .info { width: 180px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="grid" class="grid"></div>
<script src="../../js/engine.js"></script>
<script src="../../js/draw.js"></script>
<script>
/* Draws every stage of a .jsonl file (?file=out/w6.jsonl&from=0&count=24) with its solution path. */
(async function () {
  var q = new URLSearchParams(location.search);
  var text = await (await fetch(q.get('file'), { cache: 'reload' })).text();
  var rows = text.trim().split('\n').filter(Boolean).map(function (l) { return JSON.parse(l); });
  var from = +(q.get('from') || 0), count = +(q.get('count') || 24);
  rows.slice(from, from + count).forEach(function (row, k) {
    var lv = row.level || row, box = document.createElement('div');
    box.className = 'item';
    var cv = document.createElement('canvas'); cv.width = 360; cv.height = 640;
    box.appendChild(cv);
    var info = document.createElement('div'); info.className = 'info';
    info.textContent = '#' + (from + k) + ' ' + (row.tpl || '') + ' n=' + (row.n || '') + ' diff=' + (row.diff || '') + '\nclear=' + (row.clear || '') + '\n' + lv.sol;
    box.appendChild(info);
    document.getElementById('grid').appendChild(box);
    var c = cv.getContext('2d');
    Draw.background(c, row.theme || 0, 0, 0, 360, 640);
    var w = new Engine.World(lv);
    // solution path
    var acts = Engine.parseSol(lv.sol), ai = 0, sim = new Engine.World(lv, { fast: true });
    c.fillStyle = 'rgba(255,60,120,.55)';
    for (var s = 0; s < 1600 && sim.state === 'play'; s++) {
      while (ai < acts.length && acts[ai].t <= sim.t + 1e-9) { sim.act(acts[ai].a); ai++; }
      sim.step();
      if (s % 3 === 0 && !sim.held) { c.beginPath(); c.arc(sim.candy.x, sim.candy.y, 2, 0, 6.3); c.fill(); }
    }
    var t = 0;
    w.ropes.forEach(function (r) { if (r.mv) Draw.rail(c, r.mv); });
    w.hooks.forEach(function (h) { Draw.hook(c, h, t); });
    w.spikes.forEach(function (sp) { Draw.spikes(c, sp); });
    w.pads.forEach(function (p) { Draw.jelly(c, p, -9); });
    w.bubbles.forEach(function (b, i) { if (b.state === 0) Draw.bubble(c, b.x, b.y, Engine.P.bubbleR, i); });
    w.stars.forEach(function (st, i) { Draw.star(c, st.x, st.y, 0, i, 1); });
    w.blowers.forEach(function (b) { Draw.blower(c, b, 0); });
    w.hats.forEach(function (h, i) { Draw.hat(c, h.ax, h.ay, 0, i); Draw.hat(c, h.bx, h.by, 0.5, i); });
    w.rotors.forEach(function (r) { Draw.rotor(c, Engine.rotorEnds(r, 0), r.x, r.y); });
    Draw.critter(c, { x: w.frog.x, y: w.frog.y, t: 0, look: w.candy, open: 0, mode: 'idle', perch: w.frog.y < 530 });
    w.ropes.forEach(function (r) { Draw.rope(c, r.pts, 1); Draw.pin(c, r.pts[0].x, r.pts[0].y); });
    Draw.food(c, 'candy', w.candy.x, w.candy.y, Engine.P.candyR, 0);
    if (w.candy.bubble >= 0) Draw.bubble(c, w.candy.x, w.candy.y, Engine.P.bubbleR + 2, 0);
  });
})();
</script>
</body>
</html>
